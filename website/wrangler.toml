# Groupify's website (home page and privacy policy), served by Cloudflare as static assets.
# Deploy: npx wrangler deploy (from this folder)
name = "groupify-website"
compatibility_date = "2026-09-01"
workers_dev = false

[assets]
directory = "./public"
# /privacy serves privacy/index.html; /privacy/ redirects to /privacy.
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"

[[routes]]
pattern = "groupify.aoricreative.com"
custom_domain = true

[observability]
enabled = false
